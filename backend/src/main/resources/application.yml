server:
  port: ${PORT:8080}

spring:
  application:
    name: gst-invoice-studio-backend

  # Default: In-Memory / File-based H2 Database for 0-setup instant run
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:/tmp/gst_invoicedb;DB_CLOSE_DELAY=-1}
    driverClassName: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # Gmail SMTP Mail Service Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER:your-email@gmail.com}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

# JWT Secret & OTP Configurations
app:
  jwt:
    secret: 9a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b
    expiration-ms: 86400000 # 24 hours
  otp:
    expiration-minutes: 10
    demo-bypass: ${DEMO_BYPASS:true}
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    brevo-api-key: ${BREVO_API_KEY:}

cors:
  allowed-origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:3000"
    - "https://saurabhsingh3198.github.io"
    - "https://gst-invoice-generator.vercel.app"
